name: Deploy VPS Webinoly

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      PORT: ${{ vars.PORT || '8787' }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      DATA_DIR: ${{ vars.DATA_DIR || '/var/lib/bacpq' }}
      POLL_MS: ${{ vars.POLL_MS || '2000' }}
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: PORT,VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,VAPID_SUBJECT,DATA_DIR,POLL_MS
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/bacpq
            sudo -u bacpq git fetch origin
            sudo -u bacpq git checkout '${{ github.ref_name }}'
            sudo --preserve-env=PORT,VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,VAPID_SUBJECT,DATA_DIR,POLL_MS \
              bash scripts/deploy.sh
