name: Deploy VPS Webinoly

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Production node_modules
        run: rm -rf node_modules && npm ci --omit=dev
      - name: Pack release
        run: |
          tar -czf bacpq-release.tar.gz \
            dist \
            server/dist \
            node_modules \
            package.json \
            package-lock.json \
            deploy \
            scripts
      - uses: actions/upload-artifact@v4
        with:
          name: bacpq-release
          path: bacpq-release.tar.gz
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      PORT: ${{ vars.PORT || '8787' }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      DATA_DIR: ${{ vars.DATA_DIR || '/var/lib/bacpq' }}
      POLL_MS: ${{ vars.POLL_MS || '2000' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bacpq-release
          path: release

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy release to VPS
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "Thiếu VPS_HOST hoặc VPS_USER"
            exit 1
          fi
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            release/bacpq-release.tar.gz \
            "$SSH_USER@$SSH_HOST:/tmp/bacpq-release.tar.gz"

      - name: Deploy on VPS
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "Thiếu VPS_HOST hoặc VPS_USER"
            exit 1
          fi
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            "export PORT='${{ env.PORT }}' VAPID_PUBLIC_KEY='${{ env.VAPID_PUBLIC_KEY }}' VAPID_PRIVATE_KEY='${{ env.VAPID_PRIVATE_KEY }}' VAPID_SUBJECT='${{ env.VAPID_SUBJECT }}' DATA_DIR='${{ env.DATA_DIR }}' POLL_MS='${{ env.POLL_MS }}'; bash -s" << 'EOF'
          set -euo pipefail

          RELEASE=/tmp/bacpq-release.tar.gz
          UNPACK=/tmp/bacpq-unpack
          APP_DIR=/var/www/bacpq

          rm -rf "$UNPACK"
          mkdir -p "$UNPACK"
          tar -xzf "$RELEASE" -C "$UNPACK"

          if [ ! -f /etc/systemd/system/bacpq.service ]; then
            echo "==> First-time: seed APP_DIR + setup-vps-webinoly.sh"
            sudo mkdir -p /var/www
            sudo rm -rf "$APP_DIR"
            sudo mkdir -p "$APP_DIR"
            sudo tar -xzf "$RELEASE" -C "$APP_DIR"
            sudo --preserve-env=PORT,VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,VAPID_SUBJECT,DATA_DIR,POLL_MS \
              bash "$APP_DIR/scripts/setup-vps-webinoly.sh"
          fi

          if [ ! -e /etc/nginx/sites-available/bac.codayroi.com ]; then
            echo "WARN: chưa có site bac.codayroi.com — app vẫn deploy :8787"
            echo "  Tạo một lần trên VPS:"
            echo "  sudo site bac.codayroi.com -proxy=[127.0.0.1:8787]"
            echo "  sudo site bac.codayroi.com -ssl=on"
          fi

          echo "==> deploy.sh --release (wipe APP_DIR + extract + restart)"
          sudo --preserve-env=PORT,VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,VAPID_SUBJECT,DATA_DIR,POLL_MS \
            env APP_DIR="$APP_DIR" \
            bash "$UNPACK/scripts/deploy.sh" --release "$RELEASE"

          rm -rf "$UNPACK"
          rm -f "$RELEASE"
          EOF
