name: Deploy VPS Webinoly

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  # Chỉ kiểm tra build trên CI — bản chạy production build lại trên VPS
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      PORT: ${{ vars.PORT || '8787' }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      DATA_DIR: ${{ vars.DATA_DIR || '/var/lib/bacpq' }}
      POLL_MS: ${{ vars.POLL_MS || '2000' }}
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "Thiếu VPS_HOST hoặc VPS_USER"
            exit 1
          fi
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            "export PORT='${{ env.PORT }}' VAPID_PUBLIC_KEY='${{ env.VAPID_PUBLIC_KEY }}' VAPID_PRIVATE_KEY='${{ env.VAPID_PRIVATE_KEY }}' VAPID_SUBJECT='${{ env.VAPID_SUBJECT }}' DATA_DIR='${{ env.DATA_DIR }}' POLL_MS='${{ env.POLL_MS }}' BRANCH='${{ github.ref_name }}' REPO='https://github.com/${{ github.repository }}.git'; bash -s" << 'EOF'
          set -euo pipefail

          APP_DIR=/var/www/bacpq

          if [ ! -d "$APP_DIR/.git" ]; then
            echo "==> Clone $APP_DIR"
            sudo mkdir -p /var/www
            # Lần trước fail giữa chừng → folder tồn tại nhưng chưa phải git repo
            if [ -e "$APP_DIR" ]; then
              sudo rm -rf "$APP_DIR"
            fi
            sudo git clone -b "$BRANCH" "$REPO" "$APP_DIR"
          fi

          # Sync code trước setup — để VPS nhận script mới (vd. fix apt)
          echo "==> git sync $BRANCH"
          sudo git -C "$APP_DIR" fetch origin
          sudo git -C "$APP_DIR" checkout "$BRANCH"
          sudo git -C "$APP_DIR" pull --ff-only

          if [ ! -f /etc/systemd/system/bacpq.service ]; then
            echo "==> setup-vps-webinoly.sh"
            sudo bash "$APP_DIR/scripts/setup-vps-webinoly.sh"
          else
            sudo chown -R bacpq:bacpq "$APP_DIR" || true
          fi

          # Site Webinoly = thao tác một lần, không fallback trong CI
          if [ ! -e /etc/nginx/sites-available/bac.codayroi.com ]; then
            echo "WARN: chưa có site bac.codayroi.com — app vẫn deploy :8787"
            echo "  Tạo một lần trên VPS:"
            echo "  sudo site bac.codayroi.com -proxy=[127.0.0.1:8787]"
            echo "  sudo site bac.codayroi.com -ssl=on"
          fi

          echo "==> deploy.sh --no-pull"
          sudo --preserve-env=PORT,VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,VAPID_SUBJECT,DATA_DIR,POLL_MS \
            bash "$APP_DIR/scripts/deploy.sh" --no-pull
          EOF
